<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <title>JS Sandbox Ultimate V24 - PRESSURE & ERASER</title>
    
    <!-- Подключение Service Worker для офлайн-режима -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>

    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #0a0a0e; font-family: sans-serif; user-select: none; touch-action: none; }
        #gameCanvas { display: block; position: absolute; top: 0; left: 0; }
        
        #top-ui { position: absolute; top: 5px; left: 5px; display: flex; flex-wrap: wrap; gap: 5px; z-index: 10; max-width: 80%; }
        .tool-btn, .size-btn { background: rgba(40,40,40,0.8); color: white; border: 1px solid #555; border-radius: 4px; padding: 8px 12px; font-size: 14px; cursor: pointer; }
        .tool-btn.active { background: #ffaa00; color: black; border-color: #ffaa00; }
        
        #sys-ui { position: absolute; top: 5px; right: 5px; display: flex; gap: 5px; z-index: 10; }
        .sys-btn { background: rgba(40,40,40,0.8); color: white; border: 1px solid #555; border-radius: 4px; padding: 8px 12px; font-size: 14px; cursor: pointer; }

        #bottom-ui { position: absolute; bottom: 0; left: 0; width: 100%; height: 150px; background: #1a1a1a; display: flex; flex-direction: column; border-top: 2px solid #333; }
        
        #search-container { position: absolute; right: 5px; bottom: 155px; z-index: 20; }
        #search-input { padding: 8px; border-radius: 4px; border: 1px solid #555; background: #222; color: #fff; font-size: 14px; width: 150px; }
        
        #categories { display: flex; overflow-x: auto; background: #222; height: 40px; }
        .cat-btn { padding: 0 15px; color: #aaa; border: none; background: none; font-size: 14px; cursor: pointer; white-space: nowrap; }
        .cat-btn.active { color: #fff; border-bottom: 2px solid #ffaa00; }
        
        #elements-scroll { display: flex; overflow-x: auto; padding: 5px; height: 105px; box-sizing: border-box; }
        .mat-btn { min-width: 50px; height: 90px; margin-right: 5px; background: #333; border: 1px solid #444; border-radius: 6px; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #ddd; font-size: 10px; text-align: center; cursor: pointer; }
        .mat-btn.active { border: 2px solid #fff; background: #444; }
        .mat-btn.source { border: 2px solid #00ff00; box-shadow: 0 0 10px #00ff00; }
        .mat-color { width: 24px; height: 24px; border-radius: 50%; margin-bottom: 5px; border: 1px solid #000; }
        
        #stats { position: absolute; bottom: 155px; left: 5px; color: #fff; background: rgba(0,0,0,0.5); padding: 2px 6px; border-radius: 4px; font-size: 10px; }
        #flash-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: white; opacity: 0; pointer-events: none; z-index: 100; transition: opacity 0.1s; }
        #noise-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; pointer-events: none; z-index: 90; mix-blend-mode: overlay; }
        #shockwave-canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 95; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <canvas id="shockwave-canvas"></canvas>
    <div id="flash-overlay"></div>
    <div id="noise-overlay"></div>
    <div id="stats">FPS: 0</div>
    
    <div id="sys-ui">
        <button class="sys-btn" onclick="togglePause()">⏸</button>
        <button class="sys-btn" onclick="clearScreen()">🗑</button>
        <button class="sys-btn" onclick="toggleMusic()">🎵</button>
    </div>

    <div id="top-ui">
        <button class="tool-btn active" onclick="setTool('brush')">Кисть</button>
        <button class="tool-btn" onclick="setTool('eraser')">Ластик</button>
        <button class="tool-btn" onclick="setTool('mix')">Микс</button>
        <button class="tool-btn" onclick="setTool('hand')">Рука</button>
        <button class="size-btn" onclick="changeBrushSize(-1)">-</button>
        <button class="size-btn" id="brush-size">3</button>
        <button class="size-btn" onclick="changeBrushSize(1)">+</button>
        <button class="size-btn" onclick="toggleShape()">Форма</button>
    </div>

    <div id="search-container">
        <input type="text" id="search-input" placeholder="Поиск..." oninput="filterElements()">
    </div>

    <div id="bottom-ui">
        <div id="categories"></div>
        <div id="elements-scroll"></div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const shockCanvas = document.getElementById('shockwave-canvas');
        const shockCtx = shockCanvas.getContext('2d');
        const UI_HEIGHT = 150;
        const SCALE = 5; 
        let W, H;
        let grid, charge, switchStates = {}, sources = {}, uraniumHeat = {}, plantGrowth = {};
        let isPaused = false;
        
        let currentTool = 'brush';
        let currentMat = 1; 
        let brushSize = 3;
        let brushShape = 'circle';
        let mouse = { x: 0, y: 0, down: false, draggedNpc: null };
        let npcs = [];
        let shockwaves = [];
        let sourceMode = false;
        let music = new Audio('music.ogg'); music.loop = true;

        // Аудио
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playExplosionSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            gain.gain.setValueAtTime(1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.5);
        }

        // --- МАТЕРИАЛЫ ---
        const EMPTY=0, SAND=1, WATER=2, STONE=3, WOOD=4, FIRE=5, ACID=6, LAVA=7;
        const OIL=8, GAS=9, STEAM=10, MAGNESIUM=11, EXPLOSIVE=12, GOLD=13, RUST=14, MERCURY=15;
        const SALT=16, URANIUM=17, SODIUM=18, METAL=19, BATTERY=20, WIRE=21, BULB=22, SWITCH=23, PUMP=24;
        const BLACK_HOLE=25, JOE=26, DEXTER=27, UNBREAKABLE=28, RADIATION=29, LAMP_FLUORESCENT=30;
        const DYNAMITE=31, FUSE=32, GALLIUM=33, GASOLINE=34, CRUDE_OIL=35, SAWDUST=36, PARAFFIN=37, WAX=38;
        const COAL=39, MAGNESIUM_TAPE=40, FLAME=41, METHANE=42, CEMENT=43, SOIL=44, SEEDS=45, FIREFLY=46;
        const NITRO=47, NEON=48, VIRUS=49, TESLA_COIL=50, ACCUMULATOR=51, STEAM_ENGINE=52, POWER_BLOCK=53;
        const DOOR=54, LIGHTNING=55, GLASS=56, HEATING_WIRE=57, MET=58, SOURCE_BLOCK=59, HOT_URANIUM=60, UV=61;
        const NPC=62;
        const CHEM_START = 100;

        const ELEMENT_NAMES = ["H","He","Li","Be","B","C","N","O","F","Ne","Na","Mg","Al","Si","P","S","Cl","Ar","K","Ca","Sc","Ti","V","Cr","Mn","Fe","Co","Ni","Cu","Zn","Ga","Ge","As","Se","Br","Kr","Rb","Sr","Y","Zr","Nb","Mo","Tc","Ru","Rh","Pd","Ag","Cd","In","Sn","Sb","Te","I","Xe","Cs","Ba","La","Ce","Pr","Nd","Pm","Sm","Eu","Gd","Tb","Dy","Ho","Er","Tm","Yb","Lu","Hf","Ta","W","Re","Os","Ir","Pt","Au","Hg","Tl","Pb","Bi","Po","At","Rn","Fr","Ra","Ac","Th","Pa","U","Np","Pu","Am","Cm","Bk","Cf","Es","Fm","Md","No","Lr","Rf","Db","Sg","Bh","Hs","Mt","Ds","Rg","Cn","Nh","Fl","Mc","Lv","Ts","Og"];

        let MAT_TYPE = {}; let MAT_DENSITY = {};
        const setupPhysics = () => {
            for(let i=0; i<118; i++) { MAT_TYPE[CHEM_START+i] = 3; MAT_DENSITY[CHEM_START+i] = 10; }
            [STONE, WOOD, METAL, GOLD, RUST, BATTERY, WIRE, BULB, SWITCH, PUMP, UNBREAKABLE, LAMP_FLUORESCENT, GALLIUM, PARAFFIN, WAX, COAL, CEMENT, TESLA_COIL, ACCUMULATOR, STEAM_ENGINE, POWER_BLOCK, DOOR, GLASS, HEATING_WIRE, SOURCE_BLOCK, URANIUM, DYNAMITE, FUSE, UV].forEach(m => { MAT_TYPE[m] = 4; MAT_DENSITY[m] = 20; });
            [SAND, EXPLOSIVE, MAGNESIUM, SALT, SODIUM, SAWDUST, SOIL, SEEDS].forEach(m => { MAT_TYPE[m] = 3; MAT_DENSITY[m] = 15; });
            [WATER, ACID, LAVA, MERCURY, GASOLINE, CRUDE_OIL, NITRO, MET, HOT_URANIUM].forEach(m => { MAT_TYPE[m] = 2; MAT_DENSITY[m] = 10; });
            MAT_DENSITY[OIL] = 5; MAT_TYPE[OIL] = 2;
            [GAS, STEAM, FIRE, RADIATION, FLAME, METHANE, NEON, LIGHTNING, VIRUS, FIREFLY].forEach(m => { MAT_TYPE[m] = 1; MAT_DENSITY[m] = 1; });
        };
        setupPhysics();

        const COLORS = {
            [EMPTY]: [10,10,14], [SAND]: [222,196,110], [WATER]: [46,96,210], [STONE]: [120,120,130], [WOOD]: [124,74,34],
            [FIRE]: [255,120,30], [ACID]: [130,230,60], [LAVA]: [255,60,0], [OIL]: [40,40,20], [GAS]: [200,255,200],
            [STEAM]: [200,220,255], [MAGNESIUM]: [230,230,255], [EXPLOSIVE]: [80,80,80], [GOLD]: [255,215,0],
            [RUST]: [150,80,40], [MERCURY]: [180,180,180], [SALT]: [255,255,255], [URANIUM]: [60,255,60],
            [SODIUM]: [200,200,200], [METAL]: [170,175,185], [BATTERY]: [200,200,50], [WIRE]: [100,100,100],
            [BULB]: [80,80,80], [SWITCH]: [150,150,150], [PUMP]: [0,150,255], [BLACK_HOLE]: [0,0,0],
            [JOE]: [0,0,0], [DEXTER]: [0,0,0], [UNBREAKABLE]: [50, 50, 60], [RADIATION]: [100, 255, 0],
            [LAMP_FLUORESCENT]: [80, 200, 200], [DYNAMITE]: [200, 50, 50], [FUSE]: [150, 100, 50], [GALLIUM]: [180, 180, 200],
            [GASOLINE]: [200, 150, 50], [CRUDE_OIL]: [30, 30, 30], [SAWDUST]: [210, 180, 140], [PARAFFIN]: [240, 240, 240],
            [WAX]: [255, 255, 220], [COAL]: [20, 20, 20], [MAGNESIUM_TAPE]: [220, 220, 220], [FLAME]: [50, 150, 255],
            [METHANE]: [180, 220, 255], [CEMENT]: [150, 150, 150], [SOIL]: [100, 70, 40], [SEEDS]: [150, 200, 100],
            [FIREFLY]: [255, 255, 100], [NITRO]: [255, 255, 150], [NEON]: [255, 100, 255], [VIRUS]: [100, 255, 100],
            [TESLA_COIL]: [150, 100, 50], [ACCUMULATOR]: [200, 200, 200], [STEAM_ENGINE]: [150, 150, 150],
            [POWER_BLOCK]: [80, 80, 80], [DOOR]: [150, 100, 50], [LIGHTNING]: [200, 200, 255], [GLASS]: [200, 220, 255],
            [HEATING_WIRE]: [200, 100, 50], [MET]: [0, 100, 255], [SOURCE_BLOCK]: [50, 50, 50], [HOT_URANIUM]: [255, 50, 50],
            [UV]: [150, 0, 255], [NPC]: [150, 150, 150]
        };
        for(let i=0; i<118; i++) COLORS[CHEM_START + i] = [(i*73)%200+55, (i*137)%200+55, (i*199)%200+55];

        const NAMES = {
            [SAND]: "Песок", [WATER]: "Вода", [STONE]: "Камень", [WOOD]: "Дерево", [FIRE]: "Огонь", [ACID]: "Кислота",
            [LAVA]: "Лава", [OIL]: "Нефть", [GAS]: "Газ", [STEAM]: "Пар", [MAGNESIUM]: "Магний", [EXPLOSIVE]: "Порох",
            [GOLD]: "Золото", [RUST]: "Ржавчина", [MERCURY]: "Ртуть", [SALT]: "Соль", [URANIUM]: "Уран", [SODIUM]: "Натрий",
            [METAL]: "Металл", [BATTERY]: "Батарея", [WIRE]: "Провод", [BULB]: "Лампа", [SWITCH]: "Выключ.", [PUMP]: "Насос",
            [BLACK_HOLE]: "Дыра", [JOE]: "Джо", [DEXTER]: "Декстер", [UNBREAKABLE]: "Броня", [RADIATION]: "Радиация",
            [LAMP_FLUORESCENT]: "Люм. Лампа", [DYNAMITE]: "Динамит", [FUSE]: "Фитиль", [GALLIUM]: "Галлий",
            [GASOLINE]: "Бензин", [CRUDE_OIL]: "Нефть", [SAWDUST]: "Опилки", [PARAFFIN]: "Парафин",
            [WAX]: "Воск", [COAL]: "Уголь", [MAGNESIUM_TAPE]: "Магний", [FLAME]: "Пламя",
            [METHANE]: "Метан", [CEMENT]: "Цемент", [SOIL]: "Почва", [SEEDS]: "Семена",
            [FIREFLY]: "Светлячок", [NITRO]: "Нитроглицерин", [NEON]: "Неон", [VIRUS]: "Вирус",
            [TESLA_COIL]: "Катушка", [ACCUMULATOR]: "Аккум.", [STEAM_ENGINE]: "Пар.Машина",
            [POWER_BLOCK]: "Питание", [DOOR]: "Дверь", [LIGHTNING]: "Молния", [GLASS]: "Стекло",
            [HEATING_WIRE]: "Нагрев", [MET]: "Мет", [SOURCE_BLOCK]: "Источник", [HOT_URANIUM]: "Плавится!",
            [UV]: "Ультрафиолет", [NPC]: "НПС"
        };
        for(let i=0; i<118; i++) NAMES[CHEM_START + i] = ELEMENT_NAMES[i];

        const SPRITES = { 
            [JOE]: [new Image()], 
            [DEXTER]: [new Image()],
            [NPC]: [new Image(), new Image()]
        };
        SPRITES[JOE][0].src = 'joe.png'; 
        SPRITES[DEXTER][0].src = 'dexter.png';
        SPRITES[NPC][0].src = 'npc1.png'; 
        SPRITES[NPC][1].src = 'npc2.png'; 

        function resize() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight - UI_HEIGHT;
            shockCanvas.width = canvas.width; shockCanvas.height = canvas.height;
            W = Math.floor(canvas.width / SCALE); H = Math.floor(canvas.height / SCALE);
            grid = new Uint16Array(W * H); charge = new Uint8Array(W * H);
            for(let x=0; x<W; x++) { set(x, H-1, UNBREAKABLE); set(x, H-2, UNBREAKABLE); }
            for(let y=0; y<H; y++) { set(0, y, UNBREAKABLE); set(W-1, y, UNBREAKABLE); }
        }
        window.addEventListener('resize', resize);

        function set(x, y, mat) { if (x >= 0 && x < W && y >= 0 && y < H) grid[y * W + x] = mat; }
        function get(x, y) { if (x >= 0 && x < W && y >= 0 && y < H) return grid[y * W + x]; return UNBREAKABLE; }
        function swap(x1, y1, x2, y2) { const i1 = y1*W+x1, i2 = y2*W+x2; const t = grid[i1]; grid[i1] = grid[i2]; grid[i2] = t; }

        function setTool(t) { currentTool = t; document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active')); event.target.classList.add('active'); }
        function changeBrushSize(d) { brushSize = Math.max(1, Math.min(10, brushSize + d)); document.getElementById('brush-size').innerText = brushSize; }
        function toggleShape() { brushShape = brushShape === 'circle' ? 'square' : 'circle'; }
        function togglePause() { isPaused = !isPaused; }
        function toggleMusic() { if(music.paused) music.play(); else music.pause(); }
        function clearScreen() { 
            grid.fill(0); 
            for(let x=0; x<W; x++) { set(x, H-1, UNBREAKABLE); set(x, H-2, UNBREAKABLE); } 
            for(let y=0; y<H; y++) { set(0, y, UNBREAKABLE); set(W-1, y, UNBREAKABLE); } 
            npcs = []; switchStates = {}; sources = {}; uraniumHeat = {}; plantGrowth = {}; shockwaves = [];
        }

        let screenShake = 0;
        let radiationCount = 0;

        function update() {
            if (isPaused) return;
            if (screenShake > 0) screenShake -= 0.5;
            radiationCount = 0;

            for (let i = shockwaves.length - 1; i >= 0; i--) {
                let sw = shockwaves[i];
                sw.r += 15;
                sw.alpha -= 0.05;
                if (sw.alpha <= 0) shockwaves.splice(i, 1);
            }

            for (let key in sources) {
                let [sx, sy] = key.split(',').map(Number);
                let mat = sources[key];
                for(let dx=-2; dx<=2; dx++) for(let dy=-2; dy<=2; dy++) {
                    if (get(sx+dx, sy+dy) === EMPTY && Math.random() < 0.5) set(sx+dx, sy+dy, mat);
                }
            }

            charge.fill(0);
            let queue = [];
            for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
                let t = get(x, y);
                if (t === BATTERY || t === ACCUMULATOR || t === POWER_BLOCK) {
                    queue.push({x, y});
                    charge[y*W+x] = 1;
                }
            }
            for (let i = 0; i < queue.length; i++) {
                let {x, y} = queue[i];
                let neighbors = [[x+1,y], [x-1,y], [x,y+1], [x,y-1]];
                for (let [nx, ny] of neighbors) {
                    if (nx >= 0 && nx < W && ny >= 0 && ny < H) {
                        let t = get(nx, ny);
                        let key = ny*W+nx;
                        if ((t === WIRE || (t === SWITCH && switchStates[key] !== false) || t === HEATING_WIRE) && charge[key] === 0) {
                            charge[key] = 1;
                            queue.push({x: nx, y: ny});
                        }
                    }
                }
            }
            for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
                let t = get(x, y);
                if (t === BULB || t === LAMP_FLUORESCENT || t === PUMP || t === DOOR || t === TESLA_COIL) {
                    let powered = false;
                    for (let [nx, ny] of [[x+1,y], [x-1,y], [x,y+1], [x,y-1]]) {
                        if (nx >= 0 && nx < W && ny >= 0 && ny < H && charge[ny*W+nx] === 1) powered = true;
                    }
                    if (powered) charge[y*W+x] = 1;
                }
            }

            for (let y = H - 2; y > 0; y--) {
                let dir = Math.random() > 0.5 ? 1 : -1;
                for (let i = 1; i < W - 1; i++) {
                    let x = dir === 1 ? i : W - 1 - i;
                    let mat = get(x, y);
                    if (mat === EMPTY) continue;
                    if (mat === RADIATION) radiationCount++;

                    let mType = MAT_TYPE[mat] || 3;
                    let mDens = MAT_DENSITY[mat] || 10;

                    if (mat === FIRE || mat === FLAME) {
                        if (Math.random() < 0.1) set(x, y, EMPTY);
                        else {
                            if (get(x, y-1) === EMPTY) swap(x, y, x, y-1);
                            if (Math.random() < 0.3) {
                                let dx = Math.floor(Math.random()*3)-1, dy = Math.floor(Math.random()*3)-1;
                                let t = get(x+dx, y+dy);
                                if (t === NITRO || t === METHANE || t === DYNAMITE) { explode(x+dx, y+dy, 15); set(x+dx, y+dy, EMPTY); }
                                else if ((t === WOOD || t === OIL || t === GASOLINE || t === COAL || t === FUSE || t === MET) && Math.random() < 0.5) set(x+dx, y+dy, FIRE);
                                if (t === WATER) set(x+dx, y+dy, STEAM);
                                if (t === WAX || t === PARAFFIN) set(x+dx, y+dy, LAVA); 
                            }
                        }
                        continue;
                    }
                    if (mat === LAVA) {
                        if (Math.random() < 0.2) {
                            let dx = Math.floor(Math.random()*3)-1, dy = Math.floor(Math.random()*3)-1;
                            let t = get(x+dx, y+dy);
                            if (t === WATER) { set(x+dx, y+dy, STEAM); set(x, y, STONE); }
                            if (t === NITRO || t === METHANE || t === DYNAMITE) explode(x+dx, y+dy, 15);
                            if (t === WAX || t === PARAFFIN) set(x+dx, y+dy, LAVA);
                        }
                    }
                    if (mat === URANIUM) { 
                        let key = y*W+x;
                        if (!uraniumHeat[key]) uraniumHeat[key] = 0;
                        let heated = false;
                        for(let dx=-1; dx<=1; dx++) for(let dy=-1; dy<=1; dy++) {
                            if (get(x+dx, y+dy) === FIRE || get(x+dx, y+dy) === LAVA || get(x+dx, y+dy) === FLAME) heated = true;
                        }
                        if (heated) uraniumHeat[key] += 0.2;
                        else uraniumHeat[key] = Math.max(0, uraniumHeat[key] - 0.1);
                        if (uraniumHeat[key] > 3) set(x, y, HOT_URANIUM);
                    }
                    if (mat === HOT_URANIUM) {
                        if (Math.random() < 0.05) { explode(x, y, 30); set(x, y, RADIATION); }
                    }
                    if (mat === LIGHTNING) { explode(x, y, 2); set(x, y, EMPTY); continue; }
                    if (mat === NITRO) { 
                        if (get(x, y+1) !== EMPTY && get(x, y+1) !== WATER && Math.random() < 0.1) { explode(x, y, 15); set(x, y, EMPTY); }
                    }
                    if (mat === ACID) {
                        if (Math.random() < 0.2) {
                            let dx = Math.floor(Math.random()*3)-1, dy = Math.floor(Math.random()*3)-1;
                            let t = get(x+dx, y+dy);
                            if (t === STONE || t === WOOD || t === METAL) { set(x+dx, y+dy, GAS); set(x, y, EMPTY); }
                        }
                    }
                    if (mat === SEEDS) { 
                        let key = y*W+x;
                        if (!plantGrowth[key]) plantGrowth[key] = 0;
                        let hasWater = false, hasSoil = false;
                        for(let dx=-1; dx<=1; dx++) for(let dy=-1; dy<=1; dy++) {
                            if (get(x+dx, y+dy) === WATER) hasWater = true;
                            if (get(x+dx, y+dy+1) === SOIL) hasSoil = true;
                        }
                        if (hasWater && hasSoil) plantGrowth[key] += 0.1;
                        if (plantGrowth[key] > 5) set(x, y, WOOD);
                    }
                    if (mat === BLACK_HOLE) {
                        for(let dx=-2; dx<=2; dx++) for(let dy=-2; dy<=2; dy++) if (get(x+dx, y+dy) !== BLACK_HOLE) set(x+dx, y+dy, EMPTY);
                        continue;
                    }
                    if (mat === STEAM && y > 1 && get(x, y-1) !== EMPTY && get(x, y-1) !== STEAM && get(x, y-1) !== GAS) set(x, y, WATER);
                    if (mat === MET && Math.random() < 0.001) set(x, y, VIRUS);
                    if (mat === VIRUS) {
                        if (Math.random() < 0.1) {
                            let dx = Math.floor(Math.random()*3)-1, dy = Math.floor(Math.random()*3)-1;
                            let t = get(x+dx, y+dy);
                            if (t === MET || t === WATER || t === SAND) set(x+dx, y+dy, VIRUS);
                        }
                    }
                    if (mat === HEATING_WIRE && charge[y*W+x]) {
                        if (Math.random() < 0.1) set(x, y, FIRE);
                    }

                    if (mType === 4) continue;
                    if (mType === 1) {
                        if (get(x, y-1) === EMPTY && Math.random() < 0.5) swap(x, y, x, y-1);
                    } else if (mType === 2) {
                        let checkDirs = [[-1,0],[1,0],[0,-1],[0,1]];
                        let wallCount = 0;
                        let emptyDirs = [];
                        
                        for (let [dx, dy] of checkDirs) {
                            let t = get(x+dx, y+dy);
                            if (t === STONE || t === WOOD || t === METAL || t === UNBREAKABLE || t === GLASS) wallCount++;
                            else if (t === EMPTY) emptyDirs.push({dx, dy});
                        }

                        if (wallCount >= 2 && emptyDirs.length === 1) {
                            let h = emptyDirs[0];
                            if (get(x + h.dx*2, y + h.dy*2) === EMPTY || get(x + h.dx*3, y + h.dy*3) === EMPTY) {
                                swap(x, y, x+h.dx, y+h.dy);
                                continue;
                            }
                        }

                        let targetY = y + 1, targetMat = get(x, targetY);
                        if (targetMat === EMPTY || targetMat === GAS || targetMat === STEAM || (MAT_TYPE[targetMat] < mType && mDens > (MAT_DENSITY[targetMat]||0))) {
                            swap(x, y, x, targetY);
                        } else {
                            let dx = Math.random() > 0.5 ? 1 : -1, diagTarget = get(x+dx, y+1);
                            if (diagTarget === EMPTY || diagTarget === GAS || (MAT_TYPE[diagTarget] < mType && mDens > (MAT_DENSITY[diagTarget]||0))) swap(x, y, x+dx, y+1);
                            else if (get(x+dx, y) === EMPTY) swap(x, y, x+dx, y);
                        }
                    } else {
                        let targetY = y + 1, targetMat = get(x, targetY);
                        if (targetMat === EMPTY || targetMat === GAS || targetMat === STEAM || (MAT_TYPE[targetMat] < mType && mDens > (MAT_DENSITY[targetMat]||0))) {
                            swap(x, y, x, targetY);
                        } else {
                            let dx = Math.random() > 0.5 ? 1 : -1, diagTarget = get(x+dx, y+1);
                            if (diagTarget === EMPTY || diagTarget === GAS || (MAT_TYPE[diagTarget] < mType && mDens > (MAT_DENSITY[diagTarget]||0))) swap(x, y, x+dx, y+1);
                        }
                    }
                }
            }

            for (let i = npcs.length - 1; i >= 0; i--) {
                let npc = npcs[i];
                if (npc.dragged) continue;
                npc.anim += 0.05;

                if (npc.typeAI === 'fear') {
                    let danger = false;
                    for(let dx=-3; dx<=3; dx++) for(let dy=-3; dy<=3; dy++) {
                        let t = get(Math.floor(npc.x)+dx, Math.floor(npc.y)+dy);
                        if (t === FIRE || t === LAVA || t === JOE || t === DEXTER) danger = true;
                    }
                    if (danger) npc.vx = npc.vx > 0 ? 0.5 : -0.5;
                    else if (Math.random() < 0.01) npc.vx *= -1;
                } else if (npc.typeAI === 'aggressive' || npc.typeAI === 'psycho') {
                    let closest = null, minDist = 999;
                    for(let other of npcs) {
                        if (other === npc) continue;
                        let d = Math.abs(npc.x - other.x) + Math.abs(npc.y - other.y);
                        if (d < minDist) { minDist = d; closest = other; }
                    }
                    if (closest && minDist < 20) {
                        npc.vx = (closest.x > npc.x) ? 0.3 : -0.3;
                        if (npc.typeAI === 'psycho') npc.vx *= 2;
                        if (minDist < 1.5) { closest.hp -= 5; if(closest.hp <= 0) npcs.splice(npcs.indexOf(closest), 1); }
                    } else if (Math.random() < 0.01) npc.vx *= -1;
                } else if (npc.typeAI === 'suicide') {
                    let closest = null, minDist = 999;
                    for(let dx=-10; dx<=10; dx++) for(let dy=-10; dy<=10; dy++) {
                        let t = get(Math.floor(npc.x)+dx, Math.floor(npc.y)+dy);
                        if (t === FIRE || t === LAVA) {
                            let d = Math.abs(dx) + Math.abs(dy);
                            if (d < minDist) { minDist = d; closest = {x: dx, y: dy}; }
                        }
                    }
                    if (closest) npc.vx = (closest.x > 0) ? 0.3 : -0.3;
                    else if (Math.random() < 0.01) npc.vx *= -1;
                } else if (npc.typeAI === 'stalker') {
                    let targetX = Math.floor(mouse.x);
                    if (targetX > npc.x) npc.vx = 0.15;
                    else if (targetX < npc.x) npc.vx = -0.15;
                } else if (npc.typeAI === 'maniac') {
                    let closest = null, minDist = 999;
                    for(let other of npcs) {
                        if (other === npc) continue;
                        if (other.typeAI === 'maniac' || other.typeAI === 'psycho') {
                            let d = Math.abs(npc.x - other.x) + Math.abs(npc.y - other.y);
                            if (d < minDist) { minDist = d; closest = other; }
                        }
                    }
                    if (closest && minDist < 30) {
                        npc.vx = (closest.x > npc.x) ? 0.5 : -0.5;
                        if (minDist < 1.5) { closest.hp -= 20; if(closest.hp <= 0) npcs.splice(npcs.indexOf(closest), 1); }
                    } else if (Math.random() < 0.01) npc.vx *= -1;
                } else {
                    if (Math.random() < 0.01) npc.vx *= -1;
                }

                let nx = Math.floor(npc.x + npc.vx), ny = Math.floor(npc.y), t = get(nx, ny);
                if (t === EMPTY || t === WATER || MAT_TYPE[t] === 1) npc.x += npc.vx;
                else npc.vx *= -1;
                
                npc.dir = npc.vx > 0 ? 1 : -1;
                let below = get(Math.floor(npc.x), Math.floor(npc.y + 1));
                if (below === EMPTY || below === WATER || MAT_TYPE[below] === 1) npc.y += 0.2;
                else if (t === WATER) npc.y -= 0.1;

                let hit = get(Math.floor(npc.x), Math.floor(npc.y));
                if (hit === FIRE || hit === LAVA || hit === ACID || hit === RADIATION || hit === VIRUS || hit === HOT_URANIUM) npc.hp -= 3;
                if (npc.hp <= 0) npcs.splice(i, 1);
            }
        }

        function explode(cx, cy, r) {
            screenShake = 15;
            playExplosionSound();
            
            shockwaves.push({ x: cx * SCALE, y: cy * SCALE, r: 0, alpha: 1 });
            
            const flash = document.getElementById('flash-overlay');
            flash.style.opacity = 1;
            setTimeout(() => flash.style.opacity = 0, 100);

            for (let y = cy - r; y <= cy + r; y++) for (let x = cx - r; x <= cx + r; x++) {
                if ((x-cx)**2 + (y-cy)**2 <= r*r) {
                    if (get(x, y) !== UNBREAKABLE) {
                        if (Math.random() < 0.8) set(x, y, FIRE);
                        else set(x, y, EMPTY);
                    }
                }
            }
            for (let npc of npcs) {
                let d = Math.hypot(npc.x - cx, npc.y - cy);
                if (d < r) {
                    npc.x += (npc.x - cx) * 0.5;
                    npc.y += (npc.y - cy) * 0.5;
                    npc.hp -= 20;
                }
            }
        }

        function draw() {
            ctx.save();
            if (screenShake > 0) ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);

            ctx.fillStyle = '#0a0a0e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            shockCtx.clearRect(0, 0, shockCanvas.width, shockCanvas.height);

            let metCount = 0;

            for (let y = 0; y < H; y++) {
                for (let x = 0; x < W; x++) {
                    let mat = get(x, y);
                    if (mat === EMPTY) continue;

                    let color = COLORS[mat];
                    
                    if (mat === WIRE && charge[y*W+x]) color = [255, 255, 0];
                    if ((mat === BULB || mat === LAMP_FLUORESCENT) && charge[y*W+x]) color = [255, 255, 255];
                    if (mat === SWITCH && switchStates[y*W+x] !== false) color = [50, 255, 50];
                    if (mat === UNBREAKABLE) color = [60, 60, 70];
                    if (mat === MET) metCount++;
                    
                    if (mat !== BLACK_HOLE) {
                        const noise = (Math.random() - 0.5) * 20;
                        color = [Math.max(0, Math.min(255, color[0]+noise)), Math.max(0, Math.min(255, color[1]+noise)), Math.max(0, Math.min(255, color[2]+noise))];
                    }

                    ctx.fillStyle = `rgb(${color[0]|0},${color[1]|0},${color[2]|0})`;
                    ctx.fillRect(x * SCALE, y * SCALE, SCALE, SCALE);
                }
            }

            ctx.restore();

            for (let sw of shockwaves) {
                shockCtx.beginPath();
                shockCtx.arc(sw.x, sw.y, sw.r, 0, Math.PI*2);
                shockCtx.strokeStyle = `rgba(255, 255, 255, ${sw.alpha})`;
                shockCtx.lineWidth = 4;
                shockCtx.stroke();
            }

            if (metCount > 50) {
                ctx.globalAlpha = 0.15;
                ctx.drawImage(canvas, Math.sin(Date.now() / 200) * 20, Math.cos(Date.now() / 200) * 20);
                ctx.globalAlpha = 1.0;
            }

            if (radiationCount > 100) {
                const noiseOverlay = document.getElementById('noise-overlay');
                noiseOverlay.style.opacity = Math.min(0.5, radiationCount / 2000);
            } else {
                document.getElementById('noise-overlay').style.opacity = 0;
            }

            for (let npc of npcs) {
                let sprArray = SPRITES[npc.type];
                let spr = sprArray[npc.spriteIndex];

                if (spr && spr.complete) {
                    ctx.save(); let size = 128;
                    ctx.translate(npc.x * SCALE, npc.y * SCALE);
                    if (npc.dir === -1) ctx.scale(-1, 1);
                    let frame = Math.floor(npc.anim) % 4, sw = spr.width / 2, sh = spr.height / 2;
                    let sx = (frame % 2) * sw, sy = Math.floor(frame / 2) * sh;
                    ctx.drawImage(spr, sx, sy, sw, sh, -size/2, -size, size, size);
                    ctx.restore();

                    let aiColor = 'white';
                    if (npc.typeAI === 'fear') aiColor = 'yellow';
                    if (npc.typeAI === 'aggressive') aiColor = 'orange';
                    if (npc.typeAI === 'suicide') aiColor = 'purple';
                    if (npc.typeAI === 'psycho') aiColor = 'red';
                    if (npc.typeAI === 'stalker') aiColor = 'green';
                    if (npc.typeAI === 'maniac') aiColor = 'darkred';
                    ctx.fillStyle = aiColor;
                    ctx.fillRect(npc.x * SCALE - 20, npc.y * SCALE - 160, 40, 4);

                    ctx.fillStyle = 'red'; ctx.fillRect(npc.x * SCALE - 20, npc.y * SCALE - 150, 40, 6);
                    ctx.fillStyle = 'green'; ctx.fillRect(npc.x * SCALE - 20, npc.y * SCALE - 150, 40 * (npc.hp/100), 6);
                }
            }
        }

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const cx = e.touches ? e.touches[0].clientX : e.clientX, cy = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: Math.floor((cx - rect.left) / SCALE), y: Math.floor((cy - rect.top) / SCALE) };
        }
        function handleDown(e) { e.preventDefault(); mouse.down = true; let pos = getPos(e); mouse.x = pos.x; mouse.y = pos.y; drawAction(pos.x, pos.y); }
        function handleMove(e) { e.preventDefault(); let pos = getPos(e); mouse.x = pos.x; mouse.y = pos.y; if (!mouse.down) return; drawAction(pos.x, pos.y); }
        function handleUp() { mouse.down = false; mouse.draggedNpc = null; }

        function drawAction(cx, cy) {
            if (currentTool === 'hand') {
                if (!mouse.draggedNpc) {
                    for (let npc of npcs) if (Math.abs(npc.x - cx) < 15 && Math.abs(npc.y - cy) < 20) { mouse.draggedNpc = npc; npc.dragged = true; break; }
                    if (get(cx, cy) === SWITCH) switchStates[cy*W+cx] = !switchStates[cy*W+cx];
                } else { mouse.draggedNpc.x = cx; mouse.draggedNpc.y = cy; }
                return;
            }
            if (currentTool === 'eraser') { 
                for (let y = -brushSize; y <= brushSize; y++) for (let x = -brushSize; x <= brushSize; x++) {
                    if (get(cx+x, cy+y) !== undefined) {
                        set(cx+x, cy+y, EMPTY);
                        let key = (cx+x)+','+(cy+y); if (sources[key]) delete sources[key];
                    }
                }
                return; 
            }
            if (currentTool === 'mix') {
                for (let y = -brushSize; y <= brushSize; y++) for (let x = -brushSize; x <= brushSize; x++) swap(cx+x, cy+y, cx+x+1, cy+y);
                return;
            }

            if (currentMat === JOE || currentMat === DEXTER || currentMat === NPC) {
                let spriteIndex = 0;
                let ai = 'normal';
                
                if (currentMat === JOE) {
                    spriteIndex = 0; ai = 'stalker';
                } else if (currentMat === DEXTER) {
                    spriteIndex = 0; ai = 'maniac';
                } else if (currentMat === NPC) {
                    spriteIndex = Math.floor(Math.random() * 2);
                    let r = Math.random();
                    if (r > 0.98) ai = 'psycho';
                    else if (r > 0.95) ai = 'stalker';
                    else if (r > 0.85) ai = 'suicide';
                    else if (r > 0.75) ai = 'aggressive';
                    else if (r > 0.50) ai = 'fear';
                }

                npcs.push({ x: cx, y: cy, vx: Math.random()>0.5?0.2:-0.2, dir: 1, hp: 100, type: currentMat, anim: 0, dragged: false, typeAI: ai, spriteIndex: spriteIndex });
                return;
            }
            if (currentMat === SWITCH && get(cx, cy) === SWITCH) switchStates[cy*W+cx] = !switchStates[cy*W+cx];

            if (sourceMode) {
                let key = cx+','+cy; 
                sources[key] = currentMat;
                set(cx, cy, SOURCE_BLOCK); 
                return;
            }

            let mType = MAT_TYPE[currentMat];
            for (let y = -brushSize; y <= brushSize; y++) {
                for (let x = -brushSize; x <= brushSize; x++) {
                    if (brushShape === 'circle' && x*x + y*y > brushSize*brushSize) continue;
                    let target = get(cx+x, cy+y);
                    if (target === EMPTY || target === GAS || target === STEAM) set(cx+x, cy+y, currentMat);
                    else if (mType === 4 && target !== UNBREAKABLE) set(cx+x, cy+y, currentMat);
                }
            }
        }

        canvas.addEventListener('mousedown', handleDown); canvas.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleUp);
        canvas.addEventListener('touchstart', handleDown, {passive: false}); canvas.addEventListener('touchmove', handleMove, {passive: false});
        window.addEventListener('touchend', handleUp);

        const categories = {
            "Порошки": [SAND, SALT, SAWDUST, SOIL, SEEDS, COAL, CEMENT, DYNAMITE, FUSE, EXPLOSIVE, MAGNESIUM, SODIUM, URANIUM],
            "Жидкости": [WATER, OIL, CRUDE_OIL, GASOLINE, ACID, LAVA, MERCURY, GOLD, NITRO, MET, HOT_URANIUM],
            "Газы": [GAS, STEAM, FIRE, FLAME, RADIATION, METHANE, NEON, VIRUS, LIGHTNING],
            "Твердые": [STONE, WOOD, METAL, RUST, GLASS, GALLIUM, PARAFFIN, WAX, MAGNESIUM_TAPE, CEMENT, UNBREAKABLE, UV],
            "Механизмы": [BATTERY, WIRE, SWITCH, PUMP, TESLA_COIL, ACCUMULATOR, STEAM_ENGINE, POWER_BLOCK, DOOR, HEATING_WIRE, BULB, LAMP_FLUORESCENT],
            "Химия": Array.from({length: 118}, (_, i) => CHEM_START + i),
            "Особые": [BLACK_HOLE, JOE, DEXTER, NPC, FIREFLY]
        };
        let activeCat = "Порошки";
        const catDiv = document.getElementById('categories');
        const scrollDiv = document.getElementById('elements-scroll');
        const searchInput = document.getElementById('search-input');

        function buildUI() {
            catDiv.innerHTML = ''; 
            for (let cat in categories) {
                let btn = document.createElement('button');
                btn.className = 'cat-btn' + (cat === activeCat ? ' active' : '');
                btn.innerText = cat; btn.onclick = () => { activeCat = cat; searchInput.value = ''; buildUI(); };
                catDiv.appendChild(btn);
            }
            scrollDiv.innerHTML = '';
            let list = categories[activeCat];
            let searchText = searchInput.value.toLowerCase();
            if (searchText) {
                list = Object.keys(NAMES).map(Number).filter(m => NAMES[m].toLowerCase().includes(searchText));
            }

            for (let m of list) {
                const btn = document.createElement('div');
                btn.className = 'mat-btn' + (m === currentMat ? ' active' : '') + (sourceMode && m === currentMat ? ' source' : '');
                const cBox = document.createElement('div'); cBox.className = 'mat-color';
                let c = COLORS[m] || [255,0,255]; cBox.style.backgroundColor = `rgb(${c[0]},${c[1]},${c[2]})`;
                const txt = document.createElement('div'); txt.innerText = NAMES[m] || "???";
                btn.appendChild(cBox); btn.appendChild(txt);
                
                btn.onclick = () => {
                    currentMat = m; currentTool = 'brush'; sourceMode = false;
                    document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active')); document.querySelectorAll('.tool-btn')[0].classList.add('active');
                    buildUI();
                };
                btn.ondblclick = () => {
                    if (MAT_TYPE[m] !== 4) {
                        currentMat = m; sourceMode = true;
                        buildUI();
                    }
                };
                scrollDiv.appendChild(btn);
            }
        }

        function filterElements() { buildUI(); }

        let lastTime = performance.now(), frames = 0;
        function loop(time) {
            update(); draw(); frames++;
            if (time - lastTime > 1000) { document.getElementById('stats').innerText = `FPS: ${frames}`; frames = 0; lastTime = time; }
            requestAnimationFrame(loop);
        }

        resize(); buildUI(); loop(performance.now());
    </script>
</body>
